services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prguard}
      POSTGRES_USER: ${POSTGRES_USER:-prguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prguard}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-prguard}
      DB_USERNAME: ${POSTGRES_USER:-prguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-prguard}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-rules}
      NARRATIVE_PROVIDER: ${NARRATIVE_PROVIDER:-template}
      NARRATIVE_API_URL: ${NARRATIVE_API_URL:-}
      NARRATIVE_API_KEY: ${NARRATIVE_API_KEY:-}
      NARRATIVE_MODEL: ${NARRATIVE_MODEL:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
