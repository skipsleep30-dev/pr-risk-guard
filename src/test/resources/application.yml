spring:
  datasource:
    url: jdbc:h2:mem:prguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
prguard:
  github:
    require-signature: false
  decision:
    provider: rules
  narrative:
    provider: template
PRGUARD_PASSWORD1: test-demo-password
PRGUARD_PASSWORD2: test-reviewer-password
